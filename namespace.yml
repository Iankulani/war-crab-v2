apiVersion: v1
kind: Namespace
metadata:
  name: war-crab
  labels:
    app: war-crab-v2
    version: "2.0.0"
    environment: production
  annotations:
    description: "WAR-CRAB-V2 Cybersecurity Platform Namespace"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: war-crab-quota
  namespace: war-crab
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "30"
    configmaps: "30"
