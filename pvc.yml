apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: war-crab-data-pvc
  namespace: war-crab
  labels:
    app: war-crab-v2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
  volumeMode: Filesystem
