# ============================================================
# WAR-CRAB-V2 - Docker Compose Configuration
# ============================================================

version: '3.8'

services:
  # ==================== MAIN APPLICATION ====================
  war-crab:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: war-crab-v2:2.0.0
    container_name: war-crab-v2
    hostname: war-crab
    restart: unless-stopped
    
    ports:
      - "5000:5000"    # Web Dashboard
      - "8080:8080"    # Phishing Server
      - "8443:8443"    # HTTPS Phishing
      - "4444:4444"    # C2 Server
      - "9001:9001"    # Agent Communication
    
    volumes:
      - war-crab-data:/app/.war_crab_v2
      - war-crab-reports:/app/war_crab_v2_reports
      - war-crab-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./war_crab_v2.py:/app/war_crab_v2.py:ro
      - ./config:/app/config:ro
    
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - WARCRAB_HOME=/app
      - WARCRAB_CONFIG=/app/.war_crab_v2
      - WARCRAB_LOG_LEVEL=INFO
      - WARCRAB_WEB_PORT=5000
      - WARCRAB_WEB_HOST=0.0.0.0
      - WARCRAB_PHISH_PORT=8080
      - WARCRAB_C2_PORT=4444
      - WARCRAB_AGENT_PORT=9001
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    
    networks:
      - war-crab-net
    
    depends_on:
      - redis
      - postgres
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    
    security_opt:
      - no-new-privileges:false

  # ==================== REDIS CACHE ====================
  redis:
    image: redis:7-alpine
    container_name: war-crab-redis
    hostname: redis
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-warcrab_redis_2024}
    
    networks:
      - war-crab-net
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== POSTGRESQL DATABASE ====================
  postgres:
    image: postgres:15-alpine
    container_name: war-crab-postgres
    hostname: postgres
    restart: unless-stopped
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-warcrab}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-warcrab_db_2024}
      - POSTGRES_DB=${POSTGRES_DB:-warcrab}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    networks:
      - war-crab-net
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warcrab}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== NGINX REVERSE PROXY ====================
  nginx:
    image: nginx:alpine
    container_name: war-crab-nginx
    hostname: nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    
    networks:
      - war-crab-net
    
    depends_on:
      - war-crab
    
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== PORTAINER (Docker Management) ====================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: war-crab-portainer
    hostname: portainer
    restart: unless-stopped
    
    ports:
      - "9000:9000"
      - "9443:9443"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    
    networks:
      - war-crab-net
    
    command: -H unix:///var/run/docker.sock

# ==================== NETWORKS ====================
networks:
  war-crab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: warcrab0

# ==================== VOLUMES ====================
volumes:
  war-crab-data:
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind
  
  war-crab-reports:
    driver: local
  
  war-crab-logs:
    driver: local
  
  redis-data:
    driver: local
  
  postgres-data:
    driver: local
  
  nginx-logs:
    driver: local
  
  portainer-data:
    driver: local
